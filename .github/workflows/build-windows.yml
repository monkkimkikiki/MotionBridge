name: build-windows
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt pyinstaller
      - name: Tests
        # 테스트 결과는 로그로 확인하되, 실패해도 설치 파일 빌드는 계속한다
        continue-on-error: true
        env:
          PYTHONUTF8: "1"
        run: python tests/run_all.py
      - name: Real Qt smoke (offscreen)
        # 가짜 Qt 로는 못 잡는 화면 구성 오류를 진짜 PySide6 로 확인한다. 실패해도 빌드는 계속한다.
        continue-on-error: true
        env:
          PYTHONUTF8: "1"
          QT_QPA_PLATFORM: offscreen
        run: python tests/real_qt_smoke.py
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build extraction helper (CUE4Parse)
        # CUE4Parse API 변동으로 실패할 수 있다. 실패해도 나머지 빌드는 계속한다(추출 기능만 빠짐).
        continue-on-error: true
        run: |
          git clone --depth 1 --recursive https://github.com/FabianFG/CUE4Parse third_party/CUE4Parse
          dotnet publish tools/mbextract -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o tools/mbextract/out
      - name: PyInstaller
        run: pyinstaller --noconfirm --clean packaging/motionbridge.spec
      - name: Installer (Inno Setup)
        run: |
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: MotionBridge-windows
          path: |
            dist_installer/*.exe
            dist/MotionBridge/
      - name: Release (설치 파일을 릴리스로 게시)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" dist_installer/*.exe --title "MotionBridge $TAG" --notes "자동 빌드 $TAG" --target "${{ github.sha }}"
