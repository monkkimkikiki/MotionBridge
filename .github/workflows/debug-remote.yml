name: debug-remote
on: workflow_dispatch
jobs:
  t:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy opencv-python-headless Pillow imageio-ffmpeg
      - name: worker direct
        env:
          PYTHONUTF8: "1"
          ANIMREF_WORKER_TRACE: "40"
          APPDATA: ${{ runner.temp }}
        run: python tests/dbg_hang.py
